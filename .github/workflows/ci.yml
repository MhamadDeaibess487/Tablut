name: Java checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run automated tests
        run: bash scripts/test.sh
      - name: Prepare virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Check desktop integration
        run: xvfb-run -a -s '-screen 0 1280x1024x24' java -ea -cp build/Tablut.jar:build/test-classes tablut.tests.TestGui
